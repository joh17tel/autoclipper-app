# ============================================================
#  AutoClipper settings — edit this file, then run start.bat
# ============================================================

# ---- Campaigns (recommended) ----
# Put each campaign in its own folder inside "campaigns" with its brief + materials.
# See campaigns/_TEMPLATE/brief.txt. Each campaign follows its own brief.
campaigns_folder: "campaigns"

# ---- Extra streamers with no campaign (optional) ----
# Leave empty if you use campaign folders.
channels: []
#  - name: "StreamerOne"
#    url: "https://www.twitch.tv/streamerone/videos?filter=archives"
#    hashtags: "#streamerone"
#    facecam: auto

# ---- App ----
auto_start_engine: true     # start clipping as soon as the app opens
phone_access: false         # true = open the app from your phone on the same Wi-Fi

# ---- Updates (new versions install themselves) ----
auto_update: true
update_repo: "joh17tel/autoclipper-app"
update_branch: "main"

# How often to check for new streams (minutes)
check_every_minutes: 30
latest_vods_to_check: 2

# ---- How many clips per stream ----
# Longer streams give more clips: a 4-hour stream x 3 per hour = 12 clips.
clips_per_hour: 3
min_clips_per_stream: 3
max_clips_per_stream: 12

# ---- Where moments come from ----
use_viewer_clips: true        # Twitch: use clips the streamer's viewers made (human-picked = best quality)
prefer_viewer_clips: false    # true = viewer clips ONLY (more duplicate risk: everyone clips the same moments)
viewer_clip_share: 0.5        # half viewer picks, half deeper cuts from the full stream
skip_top_viewer_clips: 1      # start below the week's #1 clip (the one every clipper posts)
viewer_clips_range: "7d"      # 24hr / 7d / 30d
viewer_clips_min_views: 25    # ignore viewer clips with fewer views than this
normalize_audio: true         # even out loudness to -14 LUFS (TikTok/Shorts standard)

# ---- Self-learning ----
self_learning: true           # learn from your posts' views + other clippers, and adjust new clips
explore_rate: 0.25            # share of clips that keep experimenting (so it never gets stuck)
learn_every_hours: 6          # how often to read your posts' views

# ---- Posting ----
comment_question: true        # add a question to captions ("Rate this play 1-10") to get comments
posting_audience: "US"        # US = schedule for US evenings (your mornings) | PH = Philippine evenings
posts_per_day: 3

# ---- Content type ----
default_category: "gaming"    # gaming | irl | talk  (each campaign can set its own)
irl_layout: "follow"          # IRL/talk: follow = crop on the person (fills the screen) | fit = whole frame + blur

# ---- Clip shape ----
# Clips grow with the action: a short spike gets a short clip, a long fight gets up to 30s.
max_clip_seconds: 30        # hard cap (a campaign brief can make it shorter)
clip_before_peak: 18        # most build-up kept before the hype moment
clip_after_peak: 9          # most reaction kept after it
min_build_up: 10            # always keep at least this much setup
min_reaction: 5             # always keep at least this much reaction
cut_dead_air: true          # remove quiet stretches (no talking, no action) to keep the pace up
dead_air_seconds: 1.2       # a quiet stretch must be this long to be cut
min_gap_between_clips: 90   # seconds; stops two clips showing the same moment
use_chat: true              # also use chat spam to find moments (Twitch/YouTube)

# ---- Look ----
captions: true              # burn auto-captions onto the video
hook_on_video: true         # yellow title bar with the hook for the first 3 seconds
cold_open: true             # flash the payoff for 1.4s first, then the build-up ("wait for it")
zoom_on_peak: true          # quick punch-in zoom on the hype moment
whisper_model: "small"      # tiny / base / small ("small" suits a GTX 1660 Super)

# ---- Campaign disclosure (required by Content Rewards/Whop campaigns) ----
# Adds a "Paid partnership" tag on screen for the first seconds, and puts
# #ad at the START of every caption. A channel can override it, e.g.
#   disclosure: false      or      disclosure: {caption_tag: "#sponsored"}
disclosure:
  enabled: true
  on_screen_text: "Paid partnership"
  caption_tag: "#ad"
  seconds: 3

# Where the ready-to-post clips go.
# Tip: point this at your Google Drive folder (e.g. "G:/My Drive/Clips")
# to grab clips straight from your phone.
output_folder: "clips"

# Delete downloaded stream audio after clipping (saves disk space)
cleanup_sources: true
